name: probe
on: { push: { branches: [photo-probe] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0"
          for s in NanSun jingyanli ddaa; do curl -sL -A "$UA" https://www.bimsa.cn/zh-CN/detail/$s.html -o p.html; echo "== $s"; grep -oE '[^ "'"'"'(]*upload[^ "'"'"')]*' p.html | grep -v institution | head -5; done
          for u in https://www.bimsa.cn/zh-CN/people/index.html https://www.bimsa.cn/zh-CN/postdoc/index.html; do
            curl -sL -A "$UA" -o l.html "$u"; echo "== $u $(wc -c < l.html)"
            grep -oE 'detail/[^"]+\.html' l.html | sort -u | wc -l
            grep -oE 'page_[0-9]+\.html|\?page=[0-9]+' l.html | sort -u | head
            python3 - <<'PY'
          import re
          s=open('l.html').read()
          i=s.find('detail/'); print(s[max(0,i-1500):i+600])
          PY
          done
