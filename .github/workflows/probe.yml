name: probe
on: { push: { branches: [photo-probe] } }
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow && python3 scripts/fetch-portraits.py
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add public/people/portraits scripts/portrait-sources.json
          git commit -m "Fetch portraits from BIMSA" && git push || echo nothing
