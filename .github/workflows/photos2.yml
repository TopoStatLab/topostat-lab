name: photos2
on: { push: { branches: [photos-2] } }
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow && python3 scripts/fetch-portraits.py
      - run: |
          pip install html2text >/dev/null
          for u in https://www.math.tohoku.ac.jp/~yokoyama/tanaka-memorial/en.html https://www.himis-sz.cn/ry_36/ https://faculty.sdu.edu.cn/ziyunpeng/zh_CN/index/1895198/list/index.htm; do
            echo "=== PAGE $u"; curl -sL --max-time 90 --retry 3 -A "Mozilla/5.0" "$u" | html2text --ignore-images --ignore-links | grep -v '^\s*$' | head -120
          done
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add public/people/portraits && git commit -m "Fetch remaining portraits" && git push || echo nothing
